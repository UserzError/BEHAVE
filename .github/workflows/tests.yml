# Runs both test suites and the frontend build on every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: behave
          POSTGRES_PASSWORD: behave
          POSTGRES_DB: behave
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U behave" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: behave
      POSTGRES_USER: behave
      POSTGRES_PASSWORD: behave
      POSTGRES_HOST: localhost
      DJANGO_DEBUG: "true"
      ADMIN_TOKEN: ci-only-token  # a throwaway value; the real token is never in the repo
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
