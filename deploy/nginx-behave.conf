# nginx: sits in front of gunicorn. Installed as /etc/nginx/sites-available/behave (see DEPLOY.md).
#
# Two doors into the same site:
#   127.0.0.1:8080  the PUBLIC site, reached only through the Cloudflare Tunnel (cloudflared runs on this
#                   machine). The scenario designer's API (/admin/...) is refused here.
#   port 80         the FULL site including the designer, for your tailnet. The firewall (ufw) only lets
#                   port 80 in on the tailscale0 interface, so the internet and your LAN can't reach it.
# Either way, the designer still needs the admin token.

upstream behave_app {
    server 127.0.0.1:5000;   # gunicorn (behave.service)
    keepalive 16;
}

# ---------- Public: Cloudflare Tunnel -> here ----------
server {
    listen 127.0.0.1:8080;
    server_name _;

    client_max_body_size 1m;   # one answer with a mouse path is a few KB

    # The built site's files have a content hash in their names, so they can be cached for a long time.
    location /assets/ {
        root /srv/behave/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The designer's API only works over Tailscale (the other server block below).
    location /admin/ {
        default_type application/json;
        return 403 '{"error": "The scenario designer only works over the admin network (Tailscale)."}';
    }

    location / {
        proxy_pass http://behave_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # reuse connections to gunicorn (keepalive above)
        proxy_set_header Host $host;
        # Cloudflare puts the visitor's real IP in CF-Connecting-IP; visitors can't set it themselves.
        # Replace (don't append to) X-Forwarded-For, so a faked header can't dodge the rate limit.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ---------- Admin: your tailnet -> here ----------
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 5m;   # designer imports

    location /assets/ {
        root /srv/behave/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://behave_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # reuse connections to gunicorn (keepalive above)
        # Django only accepts host names listed in DJANGO_ALLOWED_HOSTS; calling every tailnet request
        # "localhost" means you don't have to list your tailnet names and IPs there.
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}
